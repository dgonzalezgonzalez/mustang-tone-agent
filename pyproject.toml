[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mustang-tone-agent"
version = "0.1.0"
description = "Local-first Fender Mustang GT tone control, recording and MCP tools"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "mcp>=1.20,<2", "numpy>=2,<3", "scipy>=1.14,<2",
  "sounddevice>=0.5,<1", "soundfile>=0.13,<1", "soundcard>=0.4,<1",
  "opencv-python>=4.10,<5", "rapidocr-onnxruntime>=1.4,<2",
  "pillow>=11,<13", "python-multipart>=0.0.20,<1", "yt-dlp>=2026.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[project.scripts]
mustang-tone-agent = "mustang.cli:main"

[tool.setuptools.packages.find]
include = ["mustang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
